name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: "!contains(github.event.head_commit.author.name, 'github-actions')"
    name: Deployment
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout Code
      uses: actions/checkout@v3

    # Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build and push the Docker image
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/uvic-course-api:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/uvic-course-api:latest

    - name: SSH into server and deploy with docker-compose
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
      run: |
        echo "$SSH_PRIVATE_KEY" > ssh_key
        chmod 600 ssh_key

        scp -i ssh_key -o StrictHostKeyChecking=no docker-compose.prod.yml $VPS_USER@$VPS_HOST:/home/ubuntu/course-api/docker-compose.yml

        ssh -i ssh_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << EOF
        cd /home/ubuntu/course-api
        sudo docker pull ${{ secrets.DOCKER_USERNAME }}/uvic-course-api:latest
        sudo docker compose down
        sudo docker compose up -d
        EOF